# Headless build-check for the Unity project: fails the check if UnityProject/ doesn't compile.
# No test suite is run (there isn't one yet) — this is a compile check only.
#
# Requires a Unity license stored as repo secrets to actually run; until then it's a quick no-op
# pass (see the "Unity license configured?" step) rather than failing every PR. To enable it:
#   1. gh secret set UNITY_EMAIL --body "you@example.com"
#      gh secret set UNITY_PASSWORD --body "your-password"
#   2. Get an activation file/license (.ulf) for a Unity Personal license and add it too:
#      gh secret set UNITY_LICENSE < path/to/Unity_v6000.x.ulf
#   Full walkthrough: https://game.ci/docs/github/activation
#
# Uses GameCI (https://game.ci/), a third-party open-source project, not an official Unity product.
name: Unity Build Check

on:
  push:
    branches: [main, develop]
    paths:
      - "UnityProject/**"
      - ".github/workflows/unity-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "UnityProject/**"
      - ".github/workflows/unity-ci.yml"

jobs:
  build:
    name: Unity Build Check
    runs-on: ubuntu-latest
    steps:
      # Job-level `if:` can't reference `secrets` directly (GitHub rejects the whole workflow file
      # if it does) — so the license check lives here as a step, and every step below is gated on
      # its output instead.
      - name: Unity license configured?
        id: license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        run: |
          if [ -n "$UNITY_LICENSE" ] || [ -n "$UNITY_EMAIL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Unity license secrets not set — skipping the actual build check. See the comment at the top of this file for setup steps."
          fi

      - uses: actions/checkout@v4
        if: steps.license.outputs.configured == 'true'
        with:
          lfs: true

      - uses: actions/cache@v4
        if: steps.license.outputs.configured == 'true'
        with:
          path: UnityProject/Library
          key: Library-UnityProject-${{ hashFiles('UnityProject/Assets/**', 'UnityProject/Packages/**', 'UnityProject/ProjectSettings/**') }}
          restore-keys: |
            Library-UnityProject-

      - uses: game-ci/unity-builder@v4
        if: steps.license.outputs.configured == 'true'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: UnityProject
          unityVersion: 6000.5.6f1
          targetPlatform: StandaloneLinux64

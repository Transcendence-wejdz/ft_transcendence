map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 8080;
    server_name _;
    return 301 https://$host:4443$request_uri;
}

server {
    listen 4443 ssl;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy settings, inherited by every proxied location below
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Unity game (static files served by nginx)
    location /unity/ {
        index index.html;
    }

    location ~ ^/unity/.+\.js\.gz$ {
        gzip off;
        add_header Content-Encoding gzip;
        default_type application/javascript;
    }

    location ~ ^/unity/.+\.wasm\.gz$ {
        gzip off;
        add_header Content-Encoding gzip;
        default_type application/wasm;
    }

    location ~ ^/unity/.+\.data\.gz$ {
        gzip off;
        add_header Content-Encoding gzip;
        default_type application/octet-stream;
    }

    # Auth endpoints: rate limited
    location ~ ^/api/(login|register)$ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://app:3000;
    }

    # Everything else goes to the app
    location / {
        proxy_pass http://app:3000;
    }
}
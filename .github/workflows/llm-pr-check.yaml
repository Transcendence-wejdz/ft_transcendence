name: llm-pr-check

on:
  pull_request:
    types: [opened, ready_for_review]

concurrency:
  group: llm-pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: [self-hosted, review]
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      PR: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: load-claude-token
        id: token
        run: |
          t=$(cat "$HOME/.claude-ci/token")
          echo "::add-mask::$t"
          echo "value=$t" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ env.PR }}/head
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ steps.token.outputs.value }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR }}

            You are a read-only reviewer. You cannot modify files or commit.

            Review this pull request using `gh pr diff` and `gh pr view`:
            - Flag any security issues, unless it really is minor.
            - Flag potential bugs and logic errors that looks major.
            - Any change that could break the build and preview CI/CD workflows.

            Be concise. Use inline comments for specific issues, then post one summary comment with `gh pr comment`.
            If nothing is wrong, post a comment with a green-check.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,Bash(git push:*),Bash(git commit:*)"

<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<title>Transcendence — Server error</title>
		<style>
			body {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				min-height: 100vh;
				margin: 0;
				padding: 0 1rem;
				background: #1d1b26;
				color: #f3e6c6;
				font-family: system-ui, sans-serif;
				text-align: center;
			}

			.status {
				margin: 0;
				color: #f2c14e;
				font-size: 5rem;
				font-weight: 700;
				line-height: 1;
			}

			h1 {
				margin: 1.5rem 0 0;
				font-size: 2.5rem;
				line-height: 1.1;
			}

			p {
				margin: 1rem 0 2rem;
				color: #d9cfb8;
			}

			a {
				padding: 0.75rem 1.25rem;
				border: 3px solid #120f18;
				border-radius: 6px;
				background: #f2c14e;
				color: #2a1a0c;
				font-weight: 700;
				text-decoration: none;
				box-shadow: inset 0 -5px 0 #c98f22, 0 4px 0 #0b0a10;
			}

			a:hover {
				background: #ffd36a;
			}
		</style>
	</head>
	<body>
		<p class="status">%sveltekit.status%</p>
		<h1>The horde broke through</h1>
		<p>Something broke on our side. Try again in a moment.</p>
		<a href="/">Back to the home page</a>
	</body>
</html>

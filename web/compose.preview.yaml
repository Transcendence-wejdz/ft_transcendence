services:
  nginx:
    ports: !reset []
    networks: [default, previews]
    labels:
      - traefik.enable=true
      - traefik.http.routers.${PREVIEW_SLUG}.rule=Host(`${PREVIEW_SLUG}.${PREVIEW_DOMAIN}`)
      - traefik.http.routers.${PREVIEW_SLUG}.entrypoints=websecure
      - traefik.http.routers.${PREVIEW_SLUG}.tls=true
      - traefik.http.routers.${PREVIEW_SLUG}.tls.certresolver=le
      - traefik.http.services.${PREVIEW_SLUG}.loadbalancer.server.port=4443
      - traefik.http.services.${PREVIEW_SLUG}.loadbalancer.server.scheme=https

  adminer:
    ports: !reset []
    networks: [default, previews]
    environment:
      ADMINER_DEFAULT_SERVER: db
    labels:
      - traefik.enable=true
      - traefik.http.routers.${PREVIEW_SLUG}-adminer.rule=Host(`${PREVIEW_SLUG}-adminer.${PREVIEW_DOMAIN}`)
      - traefik.http.routers.${PREVIEW_SLUG}-adminer.entrypoints=websecure
      - traefik.http.routers.${PREVIEW_SLUG}-adminer.tls=true
      - traefik.http.routers.${PREVIEW_SLUG}-adminer.tls.certresolver=le
      - traefik.http.services.${PREVIEW_SLUG}-adminer.loadbalancer.server.port=8080

networks:
  previews:
    external: true

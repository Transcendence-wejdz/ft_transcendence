name: build-preview

on:
  push:
    branches: [feat/ci-cd]

concurrency:
  group: preview-${{github.ref_name}}
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy
    runs-on: [self-hosted]
    timeout-minutes: 60
    steps:
      - name: health-check
        run: |
          echo "branch: $GITHUB_REF_NAME"
          docker compose version

      - uses: actions/checkout@v4
        with:
          clean: false

      - name: name
        run: |
          slug=$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-40) 
          echo "SLUG=$slug" >> "$GITHUB_ENV"
          echo "DIR=/srv/previews/$slug" >> "$GITHUB_ENV"
          echo "slug: $SLUG"

      - name: cleanup
        run: |
          rm -rf build

      - name: load-unity-license
        run: |
          set -a; . "$HOME/.unity/credentials"; set +a
          echo "::add-mask::$UNITY_PASSWORD"
          echo "UNITY_EMAIL=$UNITY_EMAIL" >> "$GITHUB_ENV"
          echo "UNITY_PASSWORD=$UNITY_PASSWORD" >> "$GITHUB_ENV"
          { echo "UNITY_LICENSE<<ULF_EOF"; cat "$HOME/.unity/Unity_lic.ulf"; echo "ULF_EOF"; } >> "$GITHUB_ENV"

      - name: build-unity-webgl
        uses: game-ci/unity-builder@v4
        with:
          projectPath: UnityProject
          unityVersion: 6000.5.6f1
          targetPlatform: WebGL
          buildProfile: "Assets/Settings/Build Profiles/webgl-dev.asset"
          buildName: game
          buildsPath: build
          versioning: None
          runAsHostUser: true

      - name: build-unity-check
        run: |
          test -f build/WebGL/game/Build/game.loader.js

      - name: stop-previous-preview
        run: |
          if [ -f "$DIR/compose.yaml" ]; then
            docker compose -p "tr-$SLUG" --project-directory "$DIR" -f "$DIR/compose.yaml" down -v --remove-orphans
          fi

      - name: copy-code
        run: |
          rm -rf "$DIR.new"
          cp -a web "$DIR.new"
          rm -rf "$DIR.new/backend/sveltekit/static/public/game"
          cp -a build/WebGL/game "$DIR.new/backend/sveltekit/static/public/game"
          rm -rf "$DIR"
          mv "$DIR.new" "$DIR"

      - name: init-env
        run: |
          set -a; . "$HOME/.preview/env"; set +a
          test -n "$PREVIEW_HOST" || { echo "::error::PREVIEW_HOST missing in ~/.preview/env"; exit 1; }
          echo "PREVIEW_HOST=$PREVIEW_HOST" >> "$GITHUB_ENV"
          cat > "$DIR/.env" <<EOF
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          POSTGRES_USER=transcendence
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          POSTGRES_DB=transcendence
          ORIGIN=https://$PREVIEW_HOST:4443
          EOF

      - name: build-web
        run: docker compose -p "tr-$SLUG" --project-directory "$DIR" -f "$DIR/compose.yaml" build

      - name: run
        run: docker compose -p "tr-$SLUG" --project-directory "$DIR" -f "$DIR/compose.yaml" up -d

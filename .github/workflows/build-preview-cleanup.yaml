name: build-preview-cleanup

on:
  delete:

jobs:
  cleanup:
    if: github.event.ref_type == 'branch'
    runs-on: [self-hosted, build]
    steps:
      - name: remove-preview
        env:
          REF: ${{ github.event.ref }}
        run: |
          slug=$(echo "$REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-40)
          dir="/srv/previews/$slug"
          if [ -f "$dir/compose.yaml" ]; then
            docker compose -p "tr-$slug" -f "$dir/compose.yaml" down -v --remove-orphans
          fi
          rm -rf "$dir" "$dir.game"
          echo "Remove preview for $REF ($slug)"

name: Web CI

# No `paths:` filter: this is a required status check on `main` (branch protection), and a required
# check that never runs (e.g. on a docs-only PR that doesn't touch web/) blocks merging forever. The
# job itself is fast, so running it unconditionally is cheap.
on:
  push:
    branches: [main, develop/web]
  pull_request:
    branches: [main, develop/web]

jobs:
  build:
    name: Web CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Detect Node project
        id: node
        run: |
          if [ -f package.json ]; then
            echo "has_package_json=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_package_json=false" >> "$GITHUB_OUTPUT"
          fi

      # No package-lock.json exists yet on the bare scaffold, so npm caching can't be keyed on one
      # until a framework is added — enable it (cache: npm, cache-dependency-path:
      # web/package-lock.json) once web/package.json exists.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Once a frontend/backend framework is added (package.json with lint/build scripts), these
      # steps take over automatically — no workflow changes needed.
      - name: Install dependencies
        if: steps.node.outputs.has_package_json == 'true'
        run: npm ci

      - name: Lint
        if: steps.node.outputs.has_package_json == 'true'
        run: npm run lint --if-present

      - name: Build
        if: steps.node.outputs.has_package_json == 'true'
        run: npm run build --if-present

      # Until then, at least catch JS syntax errors in the plain scaffold.
      - name: Syntax-check plain JS scaffold
        if: steps.node.outputs.has_package_json == 'false'
        run: |
          shopt -s globstar nullglob
          for f in **/*.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Create .env from example
        run: cp .env.example .env

      - name: Validate docker compose config
        run: docker compose -f compose.yaml config >/dev/null

      - name: Build Docker images
        run: docker compose -f compose.yaml build
